spring:
  application:
    name: ecorecicla-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecorecicla}
    username: ${DB_USERNAME:ecorecicla}
    password: ${DB_PASSWORD:ecorecicla_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
server:
  port: 8080
  error:
    include-message: never
app:
  zona-horaria: ${TZ:America/Lima}
  jwt:
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    expiracion-minutos: 60

